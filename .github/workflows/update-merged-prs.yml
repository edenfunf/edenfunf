name: Update Merged PRs

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday at 00:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days to look back (default: 30)'
        required: false
        default: '30'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: edenfunf
        run: |
          python .github/scripts/update_merged_prs.py \
            --days ${{ github.event.inputs.days || 30 }}

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md merged-prs.svg
          git diff --staged --quiet || git commit -m "chore: update merged PRs card"
          git push
